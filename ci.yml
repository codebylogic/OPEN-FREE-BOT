# Har push/PR par tests — bina Telegram token, bina opencode ke (fake binary use hoti hai).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyyaml

      - name: Compile check
        run: python -m py_compile bot.py tests/*.py

      - name: Helpers (parsing, chunking, model args)
        run: python tests/test_helpers.py

      - name: "Stream (fake opencode subprocess: ok / error / timeout / missing)"
        run: python tests/test_stream.py

      - name: Commands (/start gate, auth, model/thinking, wiring)
        run: python tests/test_commands.py

      - name: Webhook (200 / 403 / 400, /health, queue)
        run: python tests/test_webhook.py

      - name: YAML valid
        run: |
          python - <<'EOF'
          import yaml
          for f in ("render.yaml", "docker-compose.yml",
                    ".github/workflows/bot.yml", ".github/workflows/ci.yml"):
              yaml.safe_load(open(f))
              print("ok", f)
          EOF
